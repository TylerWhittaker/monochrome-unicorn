<HTML lang="en"{{HTML_CLASS}}>
<HEAD>
<META HTTP-EQUIV="content-type" CONTENT="text/html; charset=UTF-8">
<META NAME="viewport" CONTENT="width=device-width, initial-scale=1">
<TITLE>Monochrome Unicorn</TITLE>
<!--
  The styles; in the packed build only a rule hiding the page until
  src/unpack.js has unpacked them, so the bare shell is never seen.
-->
<STYLE>{{HEAD_STYLE}}</STYLE>
</HEAD>
<BODY class="min-h-screen">

<!--
  Values the printer's SSI preprocessor substitutes before serving. Parsed
  by the client as @name=value@ pairs; the framing survives values that
  contain spaces, quotes or newlines.
-->
<script type="text/plain" id="boot-vars">
{{BOOT_VARS}}
</script>


<header class="bg-ink-900 text-white">
  <div class="mx-auto max-w-6xl px-4 pt-3">
    <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
      <h1 id="hdr-name" class="text-[15px] font-semibold tracking-tight">Zebra Printer</h1>
      <span id="hdr-model" class="text-[12px] text-ink-400"></span>
      <span id="hdr-ip" class="font-mono text-[12px] text-ink-400"></span>
      <span id="hdr-status" class="pill bg-ink-800 text-ink-300">connecting</span>
      <span class="ml-auto hidden text-[11px] text-ink-500 sm:inline" id="hdr-meta"></span>
    </div>

    <nav class="-mx-1 mt-2 flex overflow-x-auto" role="tablist" aria-label="Mode">
      <button class="tab-btn" role="tab" data-tab="settings" aria-selected="true">Printer Settings</button>
      <button class="tab-btn" role="tab" data-tab="editor" aria-selected="false" title="Design and edit ZPL labels">Label Editor</button>
      <button class="tab-btn" role="tab" data-tab="format" aria-selected="false" title="Fill in stored ZPL, EPL or CPCL formats">Stored Formats</button>
      <button class="tab-btn" role="tab" data-tab="files" aria-selected="false" title="Browse, view, print and upload the printer's stored files">File System</button>
      <button class="tab-btn" role="tab" data-tab="lcd" aria-selected="false">LCD Viewer</button>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-4">
  <section id="panel-settings" role="tabpanel" data-panel="settings"></section>
  <section id="panel-editor" role="tabpanel" data-panel="editor" hidden></section>
  <section id="panel-format" role="tabpanel" data-panel="format" hidden></section>
  <section id="panel-files" role="tabpanel" data-panel="files" hidden></section>
  <section id="panel-lcd" role="tabpanel" data-panel="lcd" hidden></section>
</main>

<footer class="mx-auto max-w-6xl px-4 pb-6 text-[11px] text-ink-400">
  <div>Version {{VERSION}} &middot; Built {{BUILD_STAMP}}</div>
  <div class="mt-1">
    Monochrome Unicorn: a web app for Zebra printers &middot; Copyright &copy; 2026 Tyler Whittaker &middot;
    free software licensed under the
    <a class="underline hover:text-ink-600" href="https://www.gnu.org/licenses/agpl-3.0.html"
       target="_blank" rel="noreferrer">GNU AGPL v3</a> &middot;
    <a class="underline hover:text-ink-600" id="source-link"
       href="https://github.com/TylerWhittaker/monochrome-unicorn"
       target="_blank" rel="noreferrer">source code</a>
  </div>
</footer>

<div id="toasts" class="pointer-events-none fixed left-1/2 top-3 z-50 flex w-[min(26rem,calc(100vw-1.5rem))] -translate-x-1/2 flex-col items-center gap-2"></div>

<div id="modal-root"></div>

<!--
  Anything that escapes the app lands here. This console is usually opened
  against a printer on a bench or a phone on the shop floor, where opening
  devtools is not practical, so failures have to be visible on the page.
-->
<script>
(function () {
  function show(what, detail) {
    var box = document.getElementById('fatal');
    if (!box) {
      box = document.createElement('div');
      box.id = 'fatal';
      box.setAttribute('role', 'alert');
      box.style.cssText =
        'margin:1rem;padding:.75rem 1rem;border:1px solid #fca5a5;' +
        'background:#fef2f2;color:#7f1d1d;font:12px/1.5 ui-monospace,monospace;' +
        'white-space:pre-wrap;word-break:break-word;border-radius:6px';
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent += (box.textContent ? '\n\n' : '') + what + ': ' + detail;
    // A failure while unpacking must not stay hidden with the page.
    document.documentElement.classList.remove('unpacking');
  }
  window.addEventListener('error', function (e) {
    show(
      'Script error',
      (e.message || 'unknown') +
        (e.filename ? ' (line ' + e.lineno + ':' + e.colno + ')' : '') +
        (e.error && e.error.stack ? '\n' + e.error.stack : ''),
    );
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('Unhandled promise rejection', (r && (r.stack || r.message)) || String(r));
  });
})();
</script>

{{PAYLOAD}}
</BODY>
</HTML>
