# nginx for the telemetry server, in two parts.

# 1. In the http { } block (e.g. /etc/nginx/nginx.conf, or a file in
#    /etc/nginx/conf.d/): at most 10 reports a minute from one address.
limit_req_zone $binary_remote_addr zone=mu_telemetry:1m rate=10r/m;
# Diagnostic logs are up to a megabyte each, so fewer of them.
limit_req_zone $binary_remote_addr zone=mu_telemetry_logs:1m rate=2r/m;

# 2. In the existing server { } block for www.grizzlor.org (the one with
#    listen 80, and the listen 443 one too if the site has HTTPS):
location = /monochrome-unicorn/telemetry {
    limit_except POST { deny all; }
    client_max_body_size 1k;
    limit_req zone=mu_telemetry burst=10 nodelay;
    proxy_pass http://127.0.0.1:8701/telemetry;
    proxy_set_header Host $host;
    # Replaces, not appends to, whatever the client sent: uvicorn takes
    # the address from here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# A failed deploy's diagnostic log, sent when the user agrees to: a
# megabyte at most, which JSON's escaping can make about twice that.
location = /monochrome-unicorn/telemetry/log {
    limit_except POST { deny all; }
    client_max_body_size 4m;
    limit_req zone=mu_telemetry_logs burst=3 nodelay;
    proxy_pass http://127.0.0.1:8701/telemetry/log;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 3. Only in the port-443 server { } block: the summary page. Its
#    password travels with every request, so never over plain http;
#    the rate limit slows anyone guessing it.
location = /monochrome-unicorn/telemetry/summary {
    limit_except GET { deny all; }
    limit_req zone=mu_telemetry burst=10 nodelay;
    proxy_pass http://127.0.0.1:8701/telemetry/summary;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# And beside it, the diagnostic logs the summary links to, behind the
# same password.
location ^~ /monochrome-unicorn/telemetry/log/ {
    limit_except GET { deny all; }
    limit_req zone=mu_telemetry burst=10 nodelay;
    proxy_pass http://127.0.0.1:8701/telemetry/log/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
